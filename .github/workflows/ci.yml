name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-ml.txt pytest-cov
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q --cov=docqa --cov=config --cov-report=term-missing
      - name: UI unit tests
        run: node --test "tests/js/**/*.test.js"
      - name: Production static files
        run: |
          DJANGO_DEBUG=0 DJANGO_SECRET_KEY=ci-only-not-a-real-secret-key-0000000000000000000000 \
            python manage.py collectstatic --noinput

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docqa
          POSTGRES_PASSWORD: docqa
          POSTGRES_DB: docqa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://docqa:docqa@localhost:5432/docqa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ml.txt
      - run: pytest -q
      - name: Retrieval eval (neural model on pgvector)
        run: |
          python manage.py migrate --noinput
          python manage.py eval_retrieval --backend fastembed --show-misses --routing
      - name: Retrieval eval on the messy documents (report only, not a gate)
        run: |
          python manage.py eval_retrieval --dataset eval/messy.json --backend fastembed --show-misses --routing

  docker:
    # the image is what gets deployed, so build it and check that it starts and reports healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t answertrail:ci .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name at -p 8000:8000 -e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY=ci-only-not-a-real-secret-key-0000000000000000000000 answertrail:ci
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' at)
            echo "health: $state"
            [ "$state" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' at)" = true ] || break
            sleep 3
          done
          docker logs at
          [ "$state" = healthy ]
      - name: Runs as a non-root user and serves the app
        run: |
          [ "$(docker exec at id -u)" != 0 ]
          curl -fsS http://localhost:8000/ | grep -q "Answer Trail"

  lint:
    # style and likely-bug checks, and known vulnerabilities in the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff pip-audit
      - name: Lint
        run: ruff check .
      - name: Known vulnerabilities in the pinned dependencies
        run: pip-audit -r requirements-ml.lock

